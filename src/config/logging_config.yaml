version: 1
disable_existing_loggers: False

formatters:
  default:
    format: '[%(asctime)s] %(levelname)s - %(name)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: default
    filename: ${LOG_FILE}
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

root:
  level: INFO
  handlers: [console, file]
  propagate: yes

loggers:
  haystack:
    level: INFO
    handlers: [console, file]
    propagate: no

  chainlit:
    level: INFO
    handlers: [console, file]
    propagate: no 